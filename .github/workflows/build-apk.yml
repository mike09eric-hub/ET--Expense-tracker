name: Build ET Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require permanent Android signing secrets
        env:
          ET_KEYSTORE_BASE64: ${{ secrets.ET_ANDROID_KEYSTORE_BASE64 }}
          ET_KEYSTORE_PASSWORD: ${{ secrets.ET_ANDROID_KEYSTORE_PASSWORD }}
          ET_KEY_ALIAS: ${{ secrets.ET_ANDROID_KEY_ALIAS }}
          ET_KEY_PASSWORD: ${{ secrets.ET_ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ET_KEYSTORE_BASE64 ET_KEYSTORE_PASSWORD ET_KEY_ALIAS ET_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub Actions secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the four ET Android signing secrets in Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create Capacitor Android wrapper
        run: |
          mkdir et-android
          cd et-android
          cat > package.json <<'EOF'
          {
            "name": "et-expense-tracker-android",
            "version": "1.0.2",
            "private": true,
            "description": "Android wrapper for ET Expense Tracker",
            "scripts": { "build:android": "cap sync android" },
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": { "@capacitor/cli": "^7.4.3" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mikeeric.ettracker",
            "appName": "ET Expense Tracker",
            "webDir": "www",
            "server": {
              "url": "https://et-expense-tracker.onrender.com",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF
          mkdir www
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><p>Loading ET…</p></body></html>' > www/index.html
          npm install
          npx cap add android
          npx cap sync android

          APP_DIR="android/app/src/main/java/com/mikeeric/ettracker"
          mkdir -p "$APP_DIR"
          cat > "$APP_DIR/MainActivity.java" <<'EOF'
          package com.mikeeric.ettracker;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  webView.addJavascriptInterface(new ETFileBridge(this), "AndroidET");
              }
          }
          EOF
          cat > "$APP_DIR/ETFileBridge.java" <<'EOF'
          package com.mikeeric.ettracker;
          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import java.io.OutputStream;
          public class ETFileBridge {
              private final Context context;
              public ETFileBridge(Context context) { this.context = context.getApplicationContext(); }
              @JavascriptInterface public String getAppVersion() {
                  try { android.content.pm.PackageInfo info = context.getPackageManager().getPackageInfo(context.getPackageName(), 0); return info.versionName == null ? "0.0.0" : info.versionName; }
                  catch (Exception error) { return "0.0.0"; }
              }
              @JavascriptInterface public boolean saveFile(String base64, String fileName, String mimeType) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return false;
                  Uri fileUri = null;
                  try {
                      byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                      values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                      values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ET Expense Tracker");
                      values.put(MediaStore.Downloads.IS_PENDING, 1);
                      fileUri = context.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (fileUri == null) return false;
                      try (OutputStream output = context.getContentResolver().openOutputStream(fileUri)) {
                          if (output == null) throw new IllegalStateException("Cannot open Downloads file");
                          output.write(bytes); output.flush();
                      }
                      ContentValues complete = new ContentValues();
                      complete.put(MediaStore.Downloads.IS_PENDING, 0);
                      context.getContentResolver().update(fileUri, complete, null, null);
                      return true;
                  } catch (Exception error) {
                      if (fileUri != null) context.getContentResolver().delete(fileUri, null, null);
                      return false;
                  }
              }
          }
          EOF

      - name: Configure permanent release signing
        env:
          ET_KEYSTORE_BASE64: ${{ secrets.ET_ANDROID_KEYSTORE_BASE64 }}
          ET_KEYSTORE_PASSWORD: ${{ secrets.ET_ANDROID_KEYSTORE_PASSWORD }}
          ET_KEY_ALIAS: ${{ secrets.ET_ANDROID_KEY_ALIAS }}
          ET_KEY_PASSWORD: ${{ secrets.ET_ANDROID_KEY_PASSWORD }}
        working-directory: et-android
        run: |
          echo "$ET_KEYSTORE_BASE64" | base64 --decode > et-release-key.jks
          echo "ET_KEYSTORE_PATH=$GITHUB_WORKSPACE/et-android/et-release-key.jks" >> "$GITHUB_ENV"
          echo "ET_KEYSTORE_PASSWORD=$ET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ET_KEY_ALIAS=$ET_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ET_KEY_PASSWORD=$ET_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set app version and signing config
        working-directory: et-android/android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode 3/; s/versionName ['\"][^'\"]+['\"]/versionName '1.0.2'/" app/build.gradle
          cat >> app/build.gradle <<'EOF'

          // ET permanent signing: same keystore is used for every future release.
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ET_KEYSTORE_PATH"))
                      storePassword System.getenv("ET_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ET_KEY_ALIAS")
                      keyPassword System.getenv("ET_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          grep -E 'versionCode|versionName' app/build.gradle

      - name: Build signed release APK
        working-directory: et-android/android
        run: |
          java -version
          chmod +x gradlew
          ./gradlew assembleRelease
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ET-Expense-Tracker-APK
          path: et-android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: et-apk-${{ github.run_number }}
          name: ET Expense Tracker v1.0.2
          files: et-android/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
