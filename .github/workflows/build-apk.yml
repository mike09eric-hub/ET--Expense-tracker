name: Build ET Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create Capacitor Android wrapper
        run: |
          mkdir et-android
          cd et-android
          cat > package.json <<'EOF'
          {
            "name": "et-expense-tracker-android",
            "version": "1.0.0",
            "private": true,
            "description": "Android wrapper for ET Expense Tracker",
            "scripts": {
              "build:android": "cap sync android"
            },
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mikeeric.ettracker",
            "appName": "ET Expense Tracker",
            "webDir": "www",
            "server": {
              "url": "https://et-expense-tracker.onrender.com",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF
          mkdir www
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><p>Loading ET…</p></body></html>' > www/index.html
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: et-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ET-Expense-Tracker-APK
          path: et-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: et-apk-${{ github.run_number }}
          name: ET Expense Tracker Android APK
          files: et-android/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
